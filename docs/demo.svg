<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Claude Switcher demo: hover the notch, switch accounts, new claude sessions use the new account</title>
  <style>
    .a { animation-duration: 12s; animation-iteration-count: infinite; animation-timing-function: linear; }

    /* state before / after the switch (switch completes at 4.3s) */
    .before { animation-name: before; }
    .after  { animation-name: after; opacity: 0; }
    @keyframes before { 0%, 35.8% { opacity: 1 } 35.9%, 100% { opacity: 0 } }
    @keyframes after  { 0%, 35.8% { opacity: 0 } 35.9%, 100% { opacity: 1 } }

    /* Work row: arrow until click, spinner while switching, check afterwards */
    .work-arrow { animation-name: work-arrow; }
    .spinner    { animation-name: spinner; opacity: 0; }
    @keyframes work-arrow { 0%, 30.3% { opacity: 1 } 30.4%, 100% { opacity: 0 } }
    @keyframes spinner { 0%, 30.3% { opacity: 0 } 30.4%, 35.8% { opacity: 1 } 35.9%, 100% { opacity: 0 } }
    .spin { animation: spin .8s linear infinite; transform-origin: 0 0; }
    @keyframes spin { to { transform: rotate(360deg) } }

    /* notch: collapsed pill <-> expanded panel */
    .pill  { animation-name: pill; }
    .panel { animation-name: panel; transform-origin: 440px 0px; animation-timing-function: ease-in-out; opacity: 0; }
    .panel-content { animation-name: panel-content; opacity: 0; }
    @keyframes pill { 0%, 12.4% { opacity: 1 } 12.5%, 53.7% { opacity: 0 } 53.8%, 100% { opacity: 1 } }
    @keyframes panel {
      0%, 12.4% { opacity: 0; transform: scale(.842, .126) }
      12.5% { opacity: 1; transform: scale(.842, .126) }
      14.6%, 51.6% { opacity: 1; transform: scale(1, 1) }
      53.7% { opacity: 1; transform: scale(.842, .126) }
      53.8%, 100% { opacity: 0; transform: scale(.842, .126) }
    }
    @keyframes panel-content { 0%, 14.6% { opacity: 0 } 16%, 50.5% { opacity: 1 } 51.5%, 100% { opacity: 0 } }

    /* cursor path */
    .cursor { animation-name: cursor; animation-timing-function: ease-in-out; }
    @keyframes cursor {
      0%     { transform: translate(760px, 380px) scale(1) }
      11.7%  { transform: translate(440px, 12px) scale(1) }
      15.8%  { transform: translate(440px, 12px) scale(1) }
      27.5%  { transform: translate(590px, 114px) scale(1) }
      28.8%  { transform: translate(590px, 114px) scale(1) }
      29.6%  { transform: translate(590px, 114px) scale(.8) }
      30.4%  { transform: translate(590px, 114px) scale(1) }
      33.5%  { transform: translate(610px, 132px) scale(1) }
      46.7%  { transform: translate(610px, 132px) scale(1) }
      53.3%, 100% { transform: translate(560px, 330px) scale(1) }
    }

    /* terminal */
    .typing { animation-name: typing; }
    @keyframes typing {
      0%, 56.6% { transform: translateX(0px); animation-timing-function: steps(18, end) }
      62.5%, 100% { transform: translateX(129.6px) }
    }
    .caret-blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
    .typing-caret { animation-name: typing-caret; }
    @keyframes typing-caret { 0%, 65.7% { opacity: 1 } 65.8%, 100% { opacity: 0 } }
    .output { animation-name: output; opacity: 0; }
    @keyframes output { 0%, 65.7% { opacity: 0 } 65.8%, 100% { opacity: 1 } }

    /* captions */
    .cap1 { animation-name: cap1; }
    .cap2 { animation-name: cap2; opacity: 0; }
    .cap3 { animation-name: cap3; opacity: 0; }
    @keyframes cap1 { 0%, 23.4% { opacity: 1 } 24.2%, 100% { opacity: 0 } }
    @keyframes cap2 { 0%, 24.2% { opacity: 0 } 25%, 51.7% { opacity: 1 } 52.5%, 100% { opacity: 0 } }
    @keyframes cap3 { 0%, 52.5% { opacity: 0 } 53.3%, 100% { opacity: 1 } }

    /* fade between loops */
    .fade { animation-name: fade; }
    @keyframes fade { 0% { opacity: 1 } 2.5%, 95.8% { opacity: 0 } 100% { opacity: 1 } }

    .muted { fill: #98989d; }
    .mono { font-family: 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 12px; }
  </style>

  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b1d4f"/>
      <stop offset=".55" stop-color="#6b2f5c"/>
      <stop offset="1" stop-color="#d0743c"/>
    </linearGradient>
    <clipPath id="screen"><rect width="880" height="480" rx="14"/></clipPath>
    <g id="arrow-icon">
      <circle r="8.5" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="1.5"/>
      <path d="M-4 0 H4 M1 -3 L4 0 L1 3" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <path id="check-mark" d="M-4 0.3 L-1.2 3 L4 -2.8" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </defs>

  <g clip-path="url(#screen)">
    <rect width="880" height="480" fill="url(#wall)"/>

    <!-- menu bar -->
    <rect width="880" height="28" fill="#000" fill-opacity=".28"/>
    <g fill="#fff" font-size="13">
      <text x="18" y="18.5" font-weight="700">Finder</text>
      <text x="76" y="18.5">File</text>
      <text x="114" y="18.5">Edit</text>
      <text x="153" y="18.5">View</text>
      <text x="198" y="18.5">Go</text>
      <text x="866" y="18.5" text-anchor="end">Fri 9:41</text>
      <text x="800" y="18.5" text-anchor="end" class="a before">✳︎ Personal 42%</text>
      <text x="800" y="18.5" text-anchor="end" class="a after">✳︎ Work 18%</text>
    </g>

    <!-- collapsed notch pill -->
    <g class="a pill">
      <path d="M280 0 H600 V16 A12 12 0 0 1 588 28 H292 A12 12 0 0 1 280 16 Z" fill="#000"/>
      <g class="a before">
        <circle cx="296" cy="14" r="4" fill="#FF9F0A"/>
        <text x="586" y="18" text-anchor="end" font-size="11" font-weight="600" fill="#30D158">42%</text>
      </g>
      <g class="a after">
        <circle cx="296" cy="14" r="4" fill="#0A84FF"/>
        <text x="586" y="18" text-anchor="end" font-size="11" font-weight="600" fill="#30D158">18%</text>
      </g>
    </g>

    <!-- expanded notch panel -->
    <g class="a panel">
      <path d="M250 0 H630 V200 A22 22 0 0 1 608 222 H272 A22 22 0 0 1 250 200 Z" fill="#000"/>
      <g class="a panel-content">
        <!-- top bar -->
        <g font-size="11" font-weight="600">
          <g class="a before">
            <circle cx="268" cy="14" r="4" fill="#FF9F0A"/>
            <text x="278" y="18" fill="#fff">Personal</text>
            <text x="616" y="18" text-anchor="end" fill="#30D158">42%</text>
          </g>
          <g class="a after">
            <circle cx="268" cy="14" r="4" fill="#0A84FF"/>
            <text x="278" y="18" fill="#fff">Work</text>
            <text x="616" y="18" text-anchor="end" fill="#30D158">18%</text>
          </g>
        </g>

        <!-- row: Personal -->
        <rect x="264" y="34" width="352" height="52" rx="12" fill="#fff" fill-opacity=".06"/>
        <rect x="264" y="34" width="352" height="52" rx="12" fill="#fff" fill-opacity=".07" class="a before"/>
        <circle cx="279" cy="60" r="5" fill="#FF9F0A"/>
        <text x="294" y="53" font-size="13" font-weight="600" fill="#fff">Personal</text>
        <text x="570" y="53" font-size="10" text-anchor="end" class="muted">resets in 2h 14m</text>
        <text x="294" y="68" font-size="10" class="muted">5h</text>
        <text x="427" y="68" font-size="10" text-anchor="end" fill="#fff">42%</text>
        <rect x="294" y="72" width="133" height="4" rx="2" fill="#fff" fill-opacity=".16"/>
        <rect x="294" y="72" width="55.9" height="4" rx="2" fill="#30D158"/>
        <text x="437" y="68" font-size="10" class="muted">7d</text>
        <text x="570" y="68" font-size="10" text-anchor="end" fill="#fff">61%</text>
        <rect x="437" y="72" width="133" height="4" rx="2" fill="#fff" fill-opacity=".16"/>
        <rect x="437" y="72" width="81.1" height="4" rx="2" fill="#30D158"/>
        <g transform="translate(593 60)">
          <g class="a before"><circle r="9" fill="#FF9F0A"/><use href="#check-mark"/></g>
          <g class="a after"><use href="#arrow-icon"/></g>
        </g>

        <!-- row: Work -->
        <rect x="264" y="92" width="352" height="52" rx="12" fill="#fff" fill-opacity=".06"/>
        <rect x="264" y="92" width="352" height="52" rx="12" fill="#fff" fill-opacity=".07" class="a after"/>
        <circle cx="279" cy="118" r="5" fill="#0A84FF"/>
        <text x="294" y="111" font-size="13" font-weight="600" fill="#fff">Work</text>
        <text x="570" y="111" font-size="10" text-anchor="end" class="muted">resets in 4h 40m</text>
        <text x="294" y="126" font-size="10" class="muted">5h</text>
        <text x="427" y="126" font-size="10" text-anchor="end" fill="#fff">18%</text>
        <rect x="294" y="130" width="133" height="4" rx="2" fill="#fff" fill-opacity=".16"/>
        <rect x="294" y="130" width="23.9" height="4" rx="2" fill="#30D158"/>
        <text x="437" y="126" font-size="10" class="muted">7d</text>
        <text x="570" y="126" font-size="10" text-anchor="end" fill="#fff">35%</text>
        <rect x="437" y="130" width="133" height="4" rx="2" fill="#fff" fill-opacity=".16"/>
        <rect x="437" y="130" width="46.6" height="4" rx="2" fill="#30D158"/>
        <g transform="translate(593 118)">
          <g class="a work-arrow"><use href="#arrow-icon"/></g>
          <g class="a spinner">
            <path class="spin" d="M0 -7 A7 7 0 1 1 -7 0" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
          </g>
          <g class="a after"><circle r="9" fill="#0A84FF"/><use href="#check-mark"/></g>
        </g>

        <!-- row: Company -->
        <rect x="264" y="150" width="352" height="52" rx="12" fill="#fff" fill-opacity=".06"/>
        <circle cx="279" cy="176" r="5" fill="#30D158"/>
        <text x="294" y="169" font-size="13" font-weight="600" fill="#fff">Company</text>
        <text x="570" y="169" font-size="10" text-anchor="end" class="muted">resets in 1h 5m</text>
        <text x="294" y="184" font-size="10" class="muted">5h</text>
        <text x="427" y="184" font-size="10" text-anchor="end" fill="#fff">87%</text>
        <rect x="294" y="188" width="133" height="4" rx="2" fill="#fff" fill-opacity=".16"/>
        <rect x="294" y="188" width="115.7" height="4" rx="2" fill="#FF9F0A"/>
        <text x="437" y="184" font-size="10" class="muted">7d</text>
        <text x="570" y="184" font-size="10" text-anchor="end" fill="#fff">72%</text>
        <rect x="437" y="188" width="133" height="4" rx="2" fill="#fff" fill-opacity=".16"/>
        <rect x="437" y="188" width="95.8" height="4" rx="2" fill="#FF9F0A"/>
        <g transform="translate(593 176)"><use href="#arrow-icon"/></g>
      </g>
    </g>

    <!-- terminal -->
    <g>
      <rect x="120" y="250" width="640" height="192" rx="10" fill="#1c1c1e" stroke="#48484a"/>
      <circle cx="137" cy="264" r="5.5" fill="#ff5f57"/>
      <circle cx="155" cy="264" r="5.5" fill="#febc2e"/>
      <circle cx="173" cy="264" r="5.5" fill="#28c840"/>
      <text x="440" y="268" text-anchor="middle" font-size="12" class="muted">zsh</text>
      <line x1="120" y1="278" x2="760" y2="278" stroke="#38383a"/>

      <g class="mono">
        <text x="136" y="300" fill="#64d2ff">~ ❯</text>
        <text x="168" y="300" fill="#fff" textLength="129.6" lengthAdjust="spacing">claude-switch list</text>
        <!-- cover that reveals the command one character at a time, with the caret on its edge -->
        <g class="a typing">
          <rect x="168" y="287" width="140" height="18" fill="#1c1c1e"/>
          <g class="a typing-caret"><rect x="168" y="289" width="7" height="14" fill="#ddd" class="caret-blink"/></g>
        </g>

        <g class="a output">
          <text x="136" y="320" fill="#fff" xml:space="preserve">○ Personal       you@gmail.com</text>
          <text x="136" y="336" class="muted" xml:space="preserve">    5h 42% (resets in 2h 14m)   7d 61% (resets in 3d 4h)</text>
          <text x="136" y="352" fill="#fff" xml:space="preserve"><tspan fill="#0A84FF">●</tspan> Work           you@acme.com</text>
          <text x="136" y="368" class="muted" xml:space="preserve">    5h 18% (resets in 4h 40m)   7d 35% (resets in 5d 1h)</text>
          <text x="136" y="384" fill="#fff" xml:space="preserve">○ Company        you@bigco.com</text>
          <text x="136" y="400" class="muted" xml:space="preserve">    5h 87% (resets in 1h 5m)   7d 72% (resets in 2d 9h)</text>
          <text x="136" y="424" fill="#64d2ff">~ ❯</text>
          <rect x="168" y="413" width="7" height="14" fill="#ddd" class="caret-blink"/>
        </g>
      </g>
    </g>

    <!-- captions -->
    <g font-size="14" font-weight="500" fill="#fff" text-anchor="middle">
      <text x="440" y="466" class="a cap1">Hover the notch to see every account and its usage</text>
      <text x="440" y="466" class="a cap2">Click an account to switch, no browser login needed</text>
      <text x="440" y="466" class="a cap3">New claude sessions use it (and there's a CLI too)</text>
    </g>

    <!-- cursor -->
    <g class="a cursor">
      <path d="M0 0 L0 17 L4.5 12.8 L7.5 19.5 L10 18.4 L7.1 11.9 L13 11.9 Z" fill="#000" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/>
    </g>

    <rect width="880" height="480" fill="#1c1c1e" class="a fade"/>
  </g>
</svg>
